[tool.ruff]
target-version = "py312"
line-length = 100
# Vendored, upstream TripoSR model code (MIT) lives here verbatim except for the
# two documented local patches (see vendor/triposr/PROVENANCE.md). It is not
# authored app code, so it is exempt from our lint + the <300-line structural
# test (which only scans app/). Do not reformat it.
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "T20",  # flake8-print (no bare print())
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function call in default arg (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: opt-in tests that can contact a real external service"]
